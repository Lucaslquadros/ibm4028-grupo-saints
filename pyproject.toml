[project]
name = "projeto4-api"
version = "0.1.0"
description = "API do Projeto em Ciência de Dados IV (IBM4028) — IBMEC CDIA 2026.2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.35",
    "azure-storage-blob>=12.23",
    "azure-identity>=1.19",
    "python-multipart>=0.0.12",
    # Servidor de produção. O App Service e o Dockerfile sobem com
    # gunicorn + UvicornWorker; `fastapi dev` só existe para desenvolvimento.
    "gunicorn>=23.0",
]

[project.optional-dependencies]
# Driver do Azure SQL. Exige o ODBC Driver 18 instalado no SO.
# Localmente o projeto usa SQLite e NÃO precisa deste extra.
azuresql = ["pyodbc>=5.2"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.uv]
# Aplicação, não biblioteca: não há wheel para construir/instalar.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
# Os SKILL.md e a documentação contêm blocos de código ilustrativos —
# formatá-los descaracteriza o exemplo.
exclude = [".claude", "docs", ".venv", "frontend", "_setup"]

[tool.ruff.lint]
# E/F pycodestyle+pyflakes, I isort, B bugbear, UP pyupgrade, N naming
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["B008"]  # Depends() no default de argumento é o padrão do FastAPI

[tool.coverage.run]
source = ["app"]
