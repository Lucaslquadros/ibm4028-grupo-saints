name: Deploy — Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch: # permite disparar manualmente pela aba Actions

permissions:
  contents: read
  id-token: write # necessário para o login OIDC no Azure

# Dois merges seguidos não podem deployar por cima um do outro.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: app-projeto4-saints2026
  PYTHON_VERSION: "3.12"

jobs:
  testes:
    name: Testes (portão do deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  deploy:
    name: Publicar no App Service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [testes] # deploy NUNCA roda sem os testes verdes

    # Aprovação manual configurada em Settings > Environments > production.
    environment:
      name: production
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ env.PYTHON_VERSION }}

      # O App Service (Oryx) instala a partir de requirements.txt, não do uv.lock.
      # --extra azuresql traz o pyodbc: opcional no pyproject.toml, não entra
      # por padrão, mas é obrigatório em produção (DATABASE_URL é mssql+pyodbc).
      - name: Gerar requirements.txt
        run: uv export --no-dev --no-hashes --format requirements-txt --extra azuresql > requirements.txt

      # OIDC: nenhum segredo de longa duração guardado no GitHub.
      # Configure AZURE_CLIENT_ID / TENANT_ID / SUBSCRIPTION_ID como variables.
      - name: Login no Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: .

      # Grava o SHA publicado num App Setting. Duas funções, as duas necessárias:
      #   1. dá ao /health um identificador de build, para a verificação abaixo
      #      poder distinguir código novo de código antigo;
      #   2. mudar App Setting REINICIA a aplicação — e foi justamente a falta do
      #      restart que, em 06/11/2026, deixou o código antigo servindo depois de
      #      um deploy que o workflow considerou bem-sucedido.
      - name: Registrar o commit publicado (e reiniciar a aplicação)
        run: |
          az webapp config appsettings set \
            --resource-group rg-projeto4 \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --settings GIT_COMMIT=${{ github.sha }} \
            --output none

      # Deploy sem verificação é deploy que você descobre quebrado pelo cliente.
      # E verificação que só olha "a aplicação respondeu" é pior: dá sucesso com
      # a versão anterior no ar. Aqui exigimos que o /health informe o SHA DESTE
      # commit — é a única forma de afirmar "o que está rodando é o que subiu".
      - name: Verificar /health e o commit em produção
        run: |
          URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health"
          ESPERADO="${{ github.sha }}"
          for i in $(seq 1 40); do
            if curl -fsS "$URL" -o /tmp/health.json 2>/dev/null; then
              if grep -q "\"commit\":\"$ESPERADO\"" /tmp/health.json \
                 && grep -q '"status":"ok"' /tmp/health.json; then
                echo "Deploy verificado: $ESPERADO está no ar e saudável."
                cat /tmp/health.json
                exit 0
              fi
              echo "tentativa $i: de pé, mas ainda não é o commit esperado"
              cat /tmp/health.json
            else
              echo "tentativa $i: sem resposta (reiniciando)"
            fi
            sleep 10
          done
          echo "::error::A aplicação não passou a servir o commit $ESPERADO."
          echo "Último /health:"
          cat /tmp/health.json 2>/dev/null || echo "(sem resposta)"
          echo "Se o /health responde mas o commit é outro, o processo não trocou:"
          echo "  az webapp restart -g rg-projeto4 -n ${{ env.AZURE_WEBAPP_NAME }}"
          exit 1
